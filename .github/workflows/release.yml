name: Release Binary

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact checked commit requested by the publication controller
        required: false
        type: string

permissions:
  contents: write

# Every published main commit needs a complete release for exact-SHA matching.
# Cancelling an in-flight build can strand delivery jobs pinned to that commit.
concurrency:
  group: release-binary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify publication commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: bash .github/scripts/verify-publication-sha.sh "$EXPECTED_SHA" "$ACTUAL_SHA"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ""

      - name: Build release
        run: cargo build --release --locked --bin twir-deploy-notify

      - name: Publish binary to latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          BINARY_NAME: twir-deploy-notify
        run: |
          set -euo pipefail

          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title latest --notes "Automated latest build"
          fi

          binary="target/release/$BINARY_NAME"
          sha256="$(sha256sum "$binary" | cut -d' ' -f1)"
          jq -n --arg sha256 "$sha256" --arg source_sha "$GITHUB_SHA" \
            '{protocol: 2, sha256: $sha256, source_sha: $source_sha}' \
            > delivery-manifest.json

          gh release upload latest "$binary" --clobber
          gh release upload latest delivery-manifest.json --clobber
